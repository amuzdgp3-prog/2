# Log the normalized path without query credentials or referrer URLs.
log_format site2_safe '$remote_addr - [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent';

map_hash_bucket_size 64;
map $uri $site2_cache_control {
    /sw.js "no-cache, no-store, must-revalidate";
    /index.html "no-cache, no-store, must-revalidate";
    /manifest.webmanifest "no-cache";
    ~^/assets/ "public, immutable";
    default "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log site2_safe;
    server_tokens off;
    add_header Cache-Control $site2_cache_control;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Counter photos are uploaded straight from a phone camera.
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
