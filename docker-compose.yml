services:
  db:
    image: postgres:16-alpine
    container_name: site2-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: apixspb
      POSTGRES_USER: apixspb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - test-db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apixspb -d apixspb"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
    container_name: site2-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://apixspb:${POSTGRES_PASSWORD}@db:5432/apixspb
      JWT_SECRET: ${JWT_SECRET}
      PHOTO_DIR: /data/photos
      ADMIN_LOGIN: ${ADMIN_LOGIN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      REPORT_OWNER_EMAIL: ${REPORT_OWNER_EMAIL}
      TZ: UTC
    volumes:
      - ./data/photos:/data/photos
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
    container_name: site2-web
    restart: unless-stopped
    ports:
      - "8091:80"
    networks:
      - web
      - internal
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.site2test.rule=Host(`${TEST_SERVER_PUBLIC_IP}`)"
      - "traefik.http.routers.site2test.entrypoints=websecure"
      - "traefik.http.routers.site2test.tls=true"
      - "traefik.http.services.site2test.loadbalancer.server.port=80"

networks:
  web:
    external: true
  internal:

volumes:
  test-db-data:
