<script>
(() => {
 const root=document.getElementById('machine-card-review');
 const visits=[
  {date:'04.11.26',time:'15:42',who:'Алексей Смирнов',initials:'АС',revenue:'6 420',cash:'3 220',cashless:'3 200',games:'642',toys:'1 800',roi:'3,06',counter:'128 642',prizes:'1 284',test:'3',note:'Проверены захват и подсветка. Замечаний нет.'},
  {date:'28.10.26',time:'12:18',who:'Алексей Смирнов',initials:'АС',revenue:'7 350',cash:'3 850',cashless:'3 500',games:'735',toys:'2 100',roi:'3,50',counter:'127 997',prizes:'1 266',test:'2',note:'Добавлено 21 шт. мягких игрушек.'},
  {date:'21.10.26',time:'16:05',who:'Михаил Орлов',initials:'МО',revenue:'5 880',cash:'2 680',cashless:'3 200',games:'588',toys:'2 100',roi:'2,80',counter:'127 260',prizes:'1 245',test:'3',note:'Очищено стекло.'}
 ];

 const state={width:'desktop',compact:false};
 const saved=window.openai?.widgetState?.modelContent;
 if(saved && ['desktop','mobile'].includes(saved.width))state.width=saved.width;
 const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
 const detail=v=>`<div class="mc-detail-grid"><div class="mc-muted">Счётчик игр<strong style="color:var(--mc-ink)">${v.counter}</strong></div><div class="mc-muted">Счётчик призов<strong style="color:var(--mc-ink)">${v.prizes}</strong></div><div class="mc-muted">Тестовые игры<strong style="color:var(--mc-ink)">${v.test}</strong></div><div class="mc-muted">Цена игры при записи<strong style="color:var(--mc-ink)">10 ₽</strong></div><div class="mc-muted">Делитель счётчика<strong style="color:var(--mc-ink)">1</strong></div><div class="mc-muted">Игрушки добавлены<strong style="color:var(--mc-ink)">Мягкие · ${Number(v.toys.replace(' ',''))/100} шт. × 100 ₽</strong></div></div><p class="mc-small mc-muted" style="margin-top:15px">${v.note}</p><div class="mc-detail-actions"><button class="mc-link cursor-interaction" data-action="photo">${icon('image')} Фото счётчика</button><button class="mc-link cursor-interaction" data-action="edit">${icon('pencil')} Изменить</button><button class="mc-link cursor-interaction" data-action="delete" style="color:var(--mc-warn)">Удалить</button></div>`;
 const feed=(v,i,open=false)=>`<article class="mc-visit"><div class="mc-visit-top"><div><div class="mc-date">${v.date}<span class="mc-muted" style="font-weight:400;margin-left:8px">${v.time}</span></div><span class="mc-sub">${v.who}</span></div><div class="mc-visit-amount">${v.revenue} ₽</div></div><div class="mc-visit-values"><div><span>Наличные / безнал</span>${v.cash} / ${v.cashless} ₽</div><div><span>Новые игры</span>${v.games}</div><div><span>Игрушки добавлены</span>${v.toys} ₽</div><div><span>Выручка / себестоимость</span>${v.roi}</div></div><details class="mc-feed-details" ${open?'open':''}><summary class="mc-muted mc-small cursor-interaction">Показания и подробности ${icon('chevron-down')}</summary>${detail(v)}</details></article>`;

 const claw=`<div class="mc-section-head"><h2>Клешня и отдача</h2></div><div class="mc-claw-grid"><div class="mc-box"><h3>Текущие настройки</h3><div class="mc-setting"><span class="mc-muted">Сильный захват</span><strong>36</strong></div><div class="mc-setting"><span class="mc-muted">Средний захват</span><strong>22</strong></div><div class="mc-setting"><span class="mc-muted">Слабый захват</span><strong>12</strong></div><div class="mc-setting"><span class="mc-muted">Частота выигрыша</span><strong>1 из 18</strong></div><button class="mc-link cursor-interaction" data-action="claw" style="margin-top:12px">${icon('sliders-horizontal')} Изменить настройки</button></div><div class="mc-box"><h3>Отдача по последнему обслуживанию</h3><div class="mc-inline-value">28,0 <span class="mc-small">%</span></div><p class="mc-small mc-muted">04.11.26 · 642 игры</p><div class="mc-setting" style="margin-top:18px"><span class="mc-muted">Целевой ROI</span><strong>3,00</strong></div><div class="mc-setting"><span class="mc-muted">Выручка / добавленные игрушки</span><strong>3,57</strong></div><p class="mc-small mc-muted" style="margin-top:12px">1 800 ₽ игрушек при выручке 6 420 ₽</p></div></div>`;
 root.querySelectorAll('.mc-product').forEach((product,variantIndex)=>{

ection class="mc-panel" id="mc-${variantIndex}-history" role="tabpanel" aria-labelledby="mc-${variantIndex}-history-tab" data-panel="history"><div class="mc-section-head"><h2>История обслуживаний</h2><span class="mc-small mc-muted">Последние 3 из 18</span></div>${type==='journal'?journal():`<div class="mc-feed">${visits.map((v,i)=>feed(v,i,i===0)).join('')}</div>`}<details class="mc-bottom"><summary class="cursor-interaction"><span>Себестоимость игрушек по видам <span class="mc-muted">· 26 400 ₽</span></span>${icon('chevron-down')}</summary><table class="mc-table"><thead><tr><th>Игрушка</th><th class="mc-num">Количество</th><th class="mc-num">Сумма</th></tr></thead><tbody><tr><td>Мягкие игрушки</td><td class="mc-num">204 шт.</td><td class="mc-num">20 400 ₽</td></tr><tr><td>Брелоки</td><td class="mc-num">120 шт.</td><td class="mc-num">6 000 ₽</td></tr></tbody></table></details></section><section class="mc-panel" id="mc-${variantIndex}-claw" role="tabpanel" aria-labelledby="mc-${variantIndex}-claw-tab" data-panel="claw" hidden>${claw}</section><section class="mc-panel" id="mc-${variantIndex}-routes" role="tabpanel" aria-labelledby="mc-${variantIndex}-routes-tab" data-panel="routes" hidden><div class="mc-section-head"><h2>Маршруты аппарата</h2></div><div class="mc-route"><div><strong>Южный маршрут</strong><p class="mc-small mc-muted" style="margin-top:4px">Аппарат включён в маршрут</p></div><button class="mc-button cursor-interaction" data-action="route">Изменить назначение</button></div></section><section class="mc-panel" id="mc-${variantIndex}-technicians" role="tabpanel" aria-labelledby="mc-${variantIndex}-technicians-tab" data-panel="technicians" hidden>${technicians}</section><div class="mc-toast" role="status" hidden></div></main><div class="mc-dialog-shade" hidden><div class="mc-dialog" role="dialog" aria-modal="true" aria-label="Действие с аппаратом"><div class="mc-section-head"><h2 class="mc-dialog-title"></h2><button class="mc-open cursor-interaction" data-close aria-label="Закрыть">${icon('x')}</button></div><div class="mc-dialog-body"></div></div></div>`;
  function open(title,body){product.querySelector('.mc-dialog-title').textContent=title;product.querySelector('.mc-dialog-body').innerHTML=body;product.querySelector('.mc-dialog-shade').hidden=false;product.querySelector('[data-close]').focus();globalThis.lucide?.createIcons();}
  product.addEventListener('click',e=>{
   const tab=e.target.closest('[data-tab]');
   if(tab){product.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b===tab)));product.querySelectorAll('[data-panel]').forEach(p=>p.hidden=p.dataset.panel!==tab.dataset.tab);persist(tab.dataset.tab);}
   const expand=e.target.closest('[data-expand]');
   if(expand){const row=product.querySelector(`[data-detail="${expand.dataset.expand}"]`);row.hidden=!row.hidden;expand.setAttribute('aria-expanded',String(!row.hidden));}
   if(e.target.closest('[data-close]')||e.target===product.querySelector('.mc-dialog-shade'))product.querySelector('.mc-dialog-shade').hidden=true;
   const action=e.target.closest('[data-action]')?.dataset.action;
   if(action==='more')open('Действия с аппаратом',`<div class="mc-form"><button class="mc-button cursor-interaction" data-action="qr">${icon('qr-code')} QR-код аппарата</button><button class="mc-button cursor-interaction" data-action="replace">${icon('replace')} Заменить аппарат</button></div>`);
   if(action==='service'||action==='edit')open(action==='service'?'Новое обслуживание':'Изменить обслуживание',`<div class="mc-form"><label class="mc-field">Дата<input type="text" value="05.11.26"></label><label class="mc-field">Счётчик игр<input type="number" value="128642"></label><label class="mc-field">Тестовые игры<input type="number" value="0"></label></div><div class="mc-form-actions"><button class="mc-button cursor-interaction" data-close>Отмена</button><button class="mc-button mc-primary cursor-interaction" data-action="draft">Сохранить черновик</button></div>`);
   if(action==='draft'){product.querySelector('.mc-dialog-shade').hidden=true;const toast=product.querySelector('.mc-toast');toast.textContent='Черновик в макете сохранён. Данные сайта не изменены.';toast.hidden=false;}

   if(action==='qr')open('QR-код аппарата № 112',`<div class="mc-box" style="display:grid;place-items:center;min-height:190px">${icon('qr-code')}<span class="mc-small mc-muted">Место для QR-кода аппарата</span></div>`);
   if(action==='claw')open('Настройки клешни',`<div class="mc-form"><label class="mc-field">Сильный захват<input type="number" value="36"></label><label class="mc-field">Средний захват<input type="number" value="22"></label><label class="mc-field">Слабый захват<input type="number" value="12"></label></div><div class="mc-form-actions"><button class="mc-button mc-primary cursor-interaction" data-close>Сохранить</button></div>`);
  });
  product.addEventListener('keydown',e=>{if(e.key==='Escape')product.querySelector('.mc-dialog-shade').hidden=true;});
 });
 function persist(tab){window.openai?.setWidgetState?.({modelContent:{width:state.width,tab:tab||'history'},privateContent:{compact:state.compact}})?.catch(()=>{});}
 function render(){root.querySelectorAll('.mc-product').forEach(p=>{p.style.width=state.width==='mobile'?'390px':'100%';p.classList.toggle('mc-dense',state.compact);});}
 render();

})();
